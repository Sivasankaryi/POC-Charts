<highcharts-chart
  [Highcharts]="Highcharts"
  [options]="chartOptions"
  style="width:100%; height:450px; display:block">
</highcharts-chart>

<div class="show-all">
  <input
    type="checkbox"
    [checked]="showAllChecked"
    [indeterminate]="showAllIndeterminate"
    (change)="toggleShowAll($event)" />
  <label>Show all</label>
</div>
