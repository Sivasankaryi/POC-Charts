<!-- CHART -->
<highcharts-chart
  [Highcharts]="Highcharts"
  [options]="chartOptions"
  style="width:100%; height:400px; display:block">
</highcharts-chart>

<!-- TABLE -->
<table border="1" width="100%" style="margin-top:20px">
  <thead>
    <tr>
      <th (click)="sortBy('name')" style="cursor:pointer">
        Region ⬍
      </th>
      <th (click)="sortBy('rxDis')" style="cursor:pointer">
        RX Discard ⬍
      </th>
      <th (click)="sortBy('txDis')" style="cursor:pointer">
        TX Discard ⬍
      </th>
    </tr>
  </thead>

  <tbody>
    <tr
  *ngFor="let row of pagedData"
  [class.disabled-row]="row.isDeleted"
  (click)="!row.isDeleted && goToDetails(row.id, row.name)"
>

      <td>{{ row.name }}</td>
      <td>{{ row.rxDis }}</td>
      <td>{{ row.txDis }}</td>
    </tr>
  </tbody>
</table>

<!-- PAGINATION -->
<div class="pagination">
  <button
    (click)="prevPage()"
    [disabled]="currentPage === 1">
    Prev
  </button>

  <span>
    Page {{ currentPage }} / {{ totalPages }}
  </span>

  <button
    (click)="nextPage()"
    [disabled]="currentPage === totalPages">
    Next
  </button>
</div>
