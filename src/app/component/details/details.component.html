<div style="padding:20px">

  <div style="display:flex; justify-content:space-between">
    <h2>{{ regionName }} Details</h2>
    <button (click)="close()">X</button>
  </div>

  <div *ngIf="regionData" style="margin-top:20px; border:1px solid #ccc; padding:15px">
    <p><b>Received Discarded Packets:</b> {{ regionData.rxDis }}</p>
    <p><b>Transmitted Discarded Packets:</b> {{ regionData.txDis }}</p>
  </div>

</div>
